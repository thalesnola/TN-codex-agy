[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-argon"
version = "0.1.0"
description = "Codex-controlled local AGY Gemini task bridge"
requires-python = ">=3.12"
dependencies = ["mcp==1.26.0"]

[project.scripts]
codex-argon = "codex_argon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
