<text x="50" y="85" font-size="42" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="50" dy="0">O Codex aciona o Gemini via MCP sem</tspan><tspan x="50" dy="52">depender de terceiros</tspan></text><text x="52" y="177" font-size="24" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Ponte codex-agy — servidor MCP stdio e CLI Python exclusivos para</tspan><tspan x="52" dy="32">Gemini Argon e Flash</tspan></text><rect x="50" y="255" width="900" height="176" rx="26" fill="#fff" opacity="0.9" filter="url(#sh)"/><circle cx="85" cy="291" r="20" fill="#FF5A6E"/><text x="120" y="298" font-size="23" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="120" dy="0">Arquitetura &amp; Revisão Crítica</tspan></text><text x="120" y="323" font-size="18" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="120" dy="0">Raciocínio profundo e segunda opinião técnica</tspan></text><text x="255" y="351" font-size="15" fill="#5B6286" font-weight="800" text-anchor="middle"><tspan x="255" dy="0">IA COMANDANTE · CODEX</tspan></text><text x="675" y="351" font-size="15" fill="#5B6286" font-weight="800" text-anchor="middle"><tspan x="675" dy="0">IA OPERÁRIA · AGY</tspan></text><g filter="url(#sh)"><rect x="85" y="361" width="340" height="46" rx="23" fill="#7B5CFF"/></g><text x="255" y="391" font-size="19" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="255" dy="0">Codex · Astra / Sol</tspan></text><text x="450" y="393" font-size="28" font-weight="900" fill="#1B1F3B">→</text><g filter="url(#sh)"><rect x="505" y="361" width="340" height="46" rx="23" fill="#2F9BFF"/></g><text x="675" y="391" font-size="19" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="675" dy="0">AGY · Gemini 4 Argon</tspan></text><rect x="50" y="447" width="900" height="176" rx="26" fill="#fff" opacity="0.9" filter="url(#sh)"/><circle cx="85" cy="483" r="20" fill="#2F9BFF"/><text x="120" y="490" font-size="23" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="120" dy="0">Triagem &amp; Varredura Rápida</tspan></text><text x="120" y="515" font-size="18" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="120" dy="0">Resumo de contexto com alta vazão e baixa latência</tspan></text><text x="255" y="543" font-size="15" fill="#5B6286" font-weight="800" text-anchor="middle"><tspan x="255" dy="0">IA COMANDANTE · CODEX</tspan></text><text x="675" y="543" font-size="15" fill="#5B6286" font-weight="800" text-anchor="middle"><tspan x="675" dy="0">IA OPERÁRIA · AGY</tspan></text><g filter="url(#sh)"><rect x="85" y="553" width="340" height="46" rx="23" fill="#7B5CFF"/></g><text x="255" y="583" font-size="19" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="255" dy="0">Codex · Luna</tspan></text><text x="450" y="585" font-size="28" font-weight="900" fill="#1B1F3B">→</text><g filter="url(#sh)"><rect x="505" y="553" width="340" height="46" rx="23" fill="#2F9BFF"/></g><text x="675" y="583" font-size="19" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="675" dy="0">AGY · Gemini 3.8 Flash</tspan></text><rect x="50" y="639" width="900" height="176" rx="26" fill="#fff" opacity="0.9" filter="url(#sh)"/><circle cx="85" cy="675" r="20" fill="#16C79A"/><text x="120" y="682" font-size="23" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="120" dy="0">Descoberta Nativa de Tools</tspan></text><text x="120" y="707" font-size="18" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="120" dy="0">Protocolo MCP sem wrappers frágeis</tspan></text><text x="255" y="735" font-size="15" fill="#5B6286" font-weight="800" text-anchor="middle"><tspan x="255" dy="0">IA COMANDANTE · CODEX</tspan></text><text x="675" y="735" font-size="15" fill="#5B6286" font-weight="800" text-anchor="middle"><tspan x="675" dy="0">IA OPERÁRIA · AGY</tspan></text><g filter="url(#sh)"><rect x="85" y="745" width="340" height="46" rx="23" fill="#7B5CFF"/></g><text x="255" y="775" font-size="19" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="255" dy="0">Cliente MCP Codex</tspan></text><text x="450" y="777" font-size="28" font-weight="900" fill="#1B1F3B">→</text><g filter="url(#sh)"><rect x="505" y="745" width="340" height="46" rx="23" fill="#2F9BFF"/></g><text x="675" y="775" font-size="19" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="675" dy="0">MCP Server stdio</tspan></text><rect x="50" y="831" width="900" height="176" rx="26" fill="#fff" opacity="0.9" filter="url(#sh)"/><circle cx="85" cy="867" r="20" fill="#FFB300"/><text x="120" y="874" font-size="23" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="120" dy="0">Contratos Determinísticos</tspan></text><text x="120" y="899" font-size="18" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="120" dy="0">Entrada e saída validadas por JSON Schema</tspan></text><text x="255" y="927" font-size="15" fill="#5B6286" font-weight="800" text-anchor="middle"><tspan x="255" dy="0">IA COMANDANTE · CODEX</tspan></text><text x="675" y="927" font-size="15" fill="#5B6286" font-weight="800" text-anchor="middle"><tspan x="675" dy="0">IA OPERÁRIA · AGY</tspan></text><g filter="url(#sh)"><rect x="85" y="937" width="340" height="46" rx="23" fill="#7B5CFF"/></g><text x="255" y="967" font-size="19" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="255" dy="0">Automação &amp; CLI</tspan></text><text x="450" y="969" font-size="28" font-weight="900" fill="#1B1F3B">→</text><g filter="url(#sh)"><rect x="505" y="937" width="340" height="46" rx="23" fill="#2F9BFF"/></g><text x="675" y="967" font-size="19" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="675" dy="0">AGY · CLI Python JSON</tspan></text><g filter="url(#sh)"><rect x="50.0" y="1033" width="441.0" height="236.3" rx="24" fill="#fff"/><rect x="50.0" y="1033" width="12" height="236.3" rx="6" fill="#7B5CFF"/></g><text x="82.0" y="1081.1" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82.0" dy="0">Isolamento Puro Gemini</tspan></text><text x="82.0" y="1118.3999999999999" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82.0" dy="0">Nenhum componente aciona Claude</tspan><tspan x="82.0" dy="29.700000000000003">Code, modelos Claude ou APIs</tspan><tspan x="82.0" dy="29.700000000000003">Anthropic. Comunicação 100%</tspan><tspan x="82.0" dy="29.700000000000003">direta com o binário oficial do</tspan><tspan x="82.0" dy="29.700000000000003">Antigravity.</tspan></text><g filter="url(#sh)"><rect x="509.0" y="1033" width="441.0" height="206.60000000000002" rx="24" fill="#fff"/><rect x="509.0" y="1033" width="12" height="206.60000000000002" rx="6" fill="#16C79A"/></g><text x="541.0" y="1081.1" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="541.0" dy="0">Multiplataforma &amp; Testado</tspan></text><text x="541.0" y="1118.3999999999999" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="541.0" dy="0">Pacote Python com</tspan><tspan x="541.0" dy="29.700000000000003">pyproject.toml, validação</tspan><tspan x="541.0" dy="29.700000000000003">estrita por JSON Schema e 17</tspan><tspan x="541.0" dy="29.700000000000003">testes automatizados.</tspan></text><g filter="url(#sh)"><rect x="50" y="1287.3" width="900" height="90.1" rx="28" fill="#1B1F3B"/></g><text x="500.0" y="1330.3" font-size="23" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">Ponte direta Codex → AGY: modelos Gemini sob comando estruturado via</tspan><tspan x="500.0" dy="31.05">MCP stdio e CLI JSON.</tspan></text>
</svg>